<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iscrizione CAF Gianicolense</title>
<!-- rev. 5 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1f26;
    --muted: #726f66;
    --blue: #4e6aa9;
    --blue-dark: #37507f;
    --green: #2f7d5c;
    --red: #b3402f;
    --paper: #f3f1ea;
    --card: #ffffff;
    --line: #dcd8cc;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    padding: 56px 20px;
    min-height: 100vh;
  }
  .box {
    max-width: 520px;
    margin: 0 auto;
    background: var(--card);
    padding: 40px 36px 36px;
    border: 1px solid var(--line);
    box-shadow: 0 24px 48px -28px rgba(28, 31, 38, 0.28);
  }
  .intestazione { display: flex; justify-content: center; margin-bottom: 22px; }
  .intestazione img { max-width: 260px; display: block; }
  .divisore {
    border: none;
    border-top: 2px dashed var(--blue);
    opacity: 0.55;
    margin: 0 0 26px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .sottotitolo { font-size: 14px; color: var(--muted); margin: 0 0 8px; line-height: 1.5; }
  label { display: block; margin-top: 20px; font-weight: 600; font-size: 13px; color: var(--ink); }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 11px 12px; margin-top: 6px; box-sizing: border-box;
    border: 1px solid var(--line); border-radius: 2px; font-size: 14px;
    font-family: 'Inter', sans-serif; background: #fdfcfa; color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(78,106,169,0.15);
  }
  .checkbox-row { display: flex; align-items: center; margin-top: 20px; gap: 10px; }
  .checkbox-row input { margin: 0; width: 17px; height: 17px; accent-color: var(--blue); flex-shrink: 0; }
  .checkbox-row label { margin-top: 0; font-weight: 500; }
  .informativa {
    margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line);
  }
  .informativa h2 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 17px; margin: 0 0 10px;
  }
  .testo-informativa {
    max-height: 220px; overflow-y: auto; font-size: 12.5px; line-height: 1.6; color: var(--muted);
    background: #fdfcfa; border: 1px solid var(--line); padding: 14px 16px; margin-bottom: 4px;
  }
  .testo-informativa p { margin: 0 0 10px; }
  .testo-informativa p:last-child { margin-bottom: 0; }
  .testo-informativa strong { color: var(--ink); }
  .informativa .checkbox-row { align-items: flex-start; }
  .informativa .checkbox-row input { margin-top: 3px; }
  .informativa .checkbox-row label { font-size: 13px; font-weight: 500; line-height: 1.5; }
  button {
    margin-top: 30px; width: 100%; padding: 13px; background: var(--blue); color: #fff;
    border: none; border-radius: 2px; font-size: 15px; font-weight: 600; letter-spacing: .01em;
    cursor: pointer; font-family: 'Inter', sans-serif; transition: background .15s ease;
  }
  button:hover:not(:disabled) { background: var(--blue-dark); }
  button:disabled { background: #c7c4ba; cursor: default; }
  #esito { margin-top: 18px; font-size: 14px; }
  .ok { color: var(--green); font-weight: 600; }
  .errore { color: var(--red); font-weight: 600; }
</style>
</head>
<body>
<div class="box">
  <div class="intestazione">
    <img src="logo.png" alt="CAF Gianicolense">
  </div>
  <hr class="divisore">
  <h1>Modulo di iscrizione</h1>
  <p class="sottotitolo">Compila i campi qui sotto per completare la tua iscrizione al CAF Gianicolense.</p>
  <form id="form">
    <div id="campiDinamici"></div>

    <div class="informativa">
      <h2>Informativa privacy</h2>
      <div class="testo-informativa" id="testoInformativa">
        <p>Caricamento dell'informativa in corso...</p>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="consensoPrivacy" required>
        <label for="consensoPrivacy">Dichiaro di aver letto l'informativa sul trattamento dei dati personali e presto il mio consenso ai sensi dell'art. 13 del Regolamento europeo 679/2016.</label>
      </div>
    </div>
  </form>

  <div id="esito"></div>
</div>

<script>
  // Sostituisci con l'URL del tuo Web App Apps Script, quello che finisce con /exec
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwfARR9qd6ljdrmnar5JU-IejRR3S_6ZfIZw-lWsz8jDk9PBkMEd9uexc0F5Fd2t02VXw/exec';

  const formEl = document.getElementById('form');
  const camposEl = document.getElementById('campiDinamici');
  const esitoEl = document.getElementById('esito');
  let campiCorrenti = [];

  function creaCampo(campo) {
    const wrapper = document.createElement('div');
    if (campo.tipo === 'checkbox') {
      wrapper.className = 'checkbox-row';
      wrapper.innerHTML = `
        <input type="checkbox" id="c_${campo.nome}" name="${campo.nome}">
        <label for="c_${campo.nome}">${campo.etichetta}</label>
      `;
      return wrapper;
    }
    const label = document.createElement('label');
    label.textContent = campo.etichetta + (campo.obbligatorio ? ' *' : '');
    label.htmlFor = 'c_' + campo.nome;
    wrapper.appendChild(label);

    let input;
    if (campo.tipo === 'select') {
      input = document.createElement('select');
      const opzioni = (campo.opzioni || '').split(',').map(o => o.trim()).filter(Boolean);
      const vuota = document.createElement('option');
      vuota.value = '';
      vuota.textContent = 'Seleziona...';
      input.appendChild(vuota);
      opzioni.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o;
        opt.textContent = o;
        input.appendChild(opt);
      });
    } else if (campo.tipo === 'textarea') {
      input = document.createElement('textarea');
      input.rows = 3;
    } else {
      input = document.createElement('input');
      input.type = campo.tipo === 'numero' ? 'number' : 'text';
    }
    input.id = 'c_' + campo.nome;
    input.name = campo.nome;
    if (campo.obbligatorio) input.required = true;
    wrapper.appendChild(input);
    return wrapper;
  }

  async function caricaInformativa() {
    const container = document.getElementById('testoInformativa');
    try {
      const res = await fetch(BACKEND_URL + '?action=getPrivacy');
      const data = await res.json();
      const paragrafi = (data.testo || '').split('\n\n').filter(p => p.trim());
      container.innerHTML = '';
      paragrafi.forEach(testo => {
        const p = document.createElement('p');
        p.textContent = testo;
        container.appendChild(p);
      });
    } catch (err) {
      container.innerHTML = '<p>Errore nel caricamento dell\'informativa. Riprova più tardi.</p>';
    }
  }

  async function caricaForm() {
    try {
      const res = await fetch(BACKEND_URL + '?action=getForm');
      const data = await res.json();
      campiCorrenti = data.campi || [];
      camposEl.innerHTML = '';
      campiCorrenti.forEach(c => camposEl.appendChild(creaCampo(c)));
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.textContent = 'Invia iscrizione';
      formEl.appendChild(btn);
    } catch (err) {
      esitoEl.innerHTML = '<span class="errore">Errore nel caricamento del modulo. Riprova più tardi.</span>';
    }
  }

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = formEl.querySelector('button');
    btn.disabled = true;
    esitoEl.textContent = '';

    const dati = {};
    campiCorrenti.forEach(c => {
      const el = document.getElementById('c_' + c.nome);
      dati[c.etichetta] = c.tipo === 'checkbox' ? (el.checked ? 'Si' : 'No') : el.value;
    });
    dati['Consenso privacy'] = document.getElementById('consensoPrivacy').checked ? 'Accettato' : 'Non accettato';

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'submit', dati })
      });
      const result = await res.json();
      if (result.ok) {
        esitoEl.innerHTML = '<span class="ok">Iscrizione inviata con successo.</span>';
        formEl.reset();
      } else {
        esitoEl.innerHTML = '<span class="errore">Si è verificato un errore, riprova.</span>';
      }
    } catch (err) {
      esitoEl.innerHTML = '<span class="errore">Errore di connessione, riprova.</span>';
    } finally {
      btn.disabled = false;
    }
  });

  caricaForm();
  caricaInformativa();
</script>
</body>
</html>
