<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iscrizione CAF Gianicolense</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap">
<!--
  Modulo di iscrizione del CAF Gianicolense (fase 5 del portale nuovo, 28 ottobre 2026). Sta su GitHub Pages insieme a
  logo.png, comuni.js e cf.js (lo stesso calcolo del codice fiscale del portale).
  Legge campi e informativa da Firebase (/modulo, li pubblica il portale) e lascia l'iscrizione in /inArrivo, dove può
  solo aggiungere: non legge, non modifica e non cancella niente. Il portale la preleva e la mette in anagrafica.
  Qui c'è solo l'indirizzo del database, che non è segreto. La chiave del database non va MAI messa in questo file.
-->
<style>
  :root {
    color-scheme: light only;
    /* stessi colori del portale dalla 2.0.0: blu reale e fondo azzurrino */
    --blu: #173a7a; --blu-chiaro: #2f5fb3; --blu-bordo: #a9c0e6; --blu-tinta: #e3ecfa;
    --sfondo: #eaf0fa; --bordo: #c3d3ec; --gruppo-tinta: #dde7f6;
    --verde: #16a370; --verde-tinta: #e0f5ec; --arancio: #d2601a; --arancio-tinta: #fdeedd;
    --rosso: #c22a2a; --rosso-tinta: #fbe8e4; --testo: #152238; --testo-tenue: #52627c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: var(--sfondo); color: var(--testo); font-size: 16px; line-height: 1.4; }
  .pagina { max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; }
  .testata { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .testata img { height: 58px; width: auto; background: #fff; border-radius: 10px; padding: 6px 10px; box-shadow: 0 3px 8px rgba(55, 80, 127, .22); }
  h1 { font-family: 'Fjalla One', 'Arial Narrow', Arial, sans-serif; text-transform: uppercase; font-weight: 400; color: var(--blu); font-size: 28px; line-height: 1.05; margin: 0; }
  .sottotitolo { color: var(--blu-chiaro); font-weight: 600; font-size: 14px; margin-top: 4px; }
  .riquadro { background: #fff; border: 1px solid var(--bordo); border-radius: 12px; padding: 18px 18px 8px; margin-bottom: 14px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--blu); margin: 0 0 14px; }
  .campo { display: block; margin-bottom: 14px; font-size: 14px; font-weight: 600; color: var(--testo); }
  .campo > span.etichetta { display: block; margin-bottom: 5px; }
  .obbl { color: var(--rosso); }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], select, textarea {
    width: 100%; font: inherit; font-weight: 400; font-size: 16px; padding: 10px 11px; border: 1px solid var(--bordo); border-radius: 8px; background: #fff; color: var(--testo);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blu-chiaro); box-shadow: 0 0 0 3px rgba(78, 106, 169, .15); }
  input[readonly] { background: var(--gruppo-tinta); color: var(--testo-tenue); }
  .griglia { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .griglia .intero { grid-column: 1 / -1; }
  @media (max-width: 520px) { .griglia { grid-template-columns: 1fr; } h1 { font-size: 24px; } .testata img { height: 48px; } }
  .nota { display: block; font-size: 13px; font-weight: 400; color: var(--testo-tenue); margin-top: 5px; }
  .nota.errore { color: var(--rosso); }
  .nota.avviso { color: #7a4a00; }
  .riga-cf { display: flex; gap: 8px; }
  .riga-cf input { text-transform: uppercase; letter-spacing: .04em; }
  .btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--bordo); background: #fff; color: var(--testo); }
  .btn:hover { border-color: var(--blu-chiaro); }
  .btn-primario { background: var(--blu); border-color: var(--blu); color: #fff; width: 100%; font-size: 17px; padding: 14px; }
  .btn-primario:hover { background: var(--blu-chiaro); }
  .btn-primario:disabled { opacity: .6; cursor: default; }
  .spunta { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin-bottom: 14px; font-size: 15px; cursor: pointer; }
  .spunta input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--blu); }
  .informativa { max-height: 220px; overflow-y: auto; background: var(--sfondo); border: 1px solid var(--bordo); border-radius: 8px; padding: 4px 14px; font-size: 13.5px; color: #4a443d; margin-bottom: 14px; }
  .comune { position: relative; }
  .suggerimenti { position: absolute; left: 0; right: 0; top: 100%; margin-top: 2px; background: #fff; border: 1px solid var(--bordo); border-radius: 8px; box-shadow: 0 10px 24px rgba(0, 0, 0, .15); z-index: 10; display: none; max-height: 260px; overflow-y: auto; font-weight: 400; }
  .suggerimenti.visibile { display: block; }
  .suggerimenti div { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #dbe5f4; }
  .suggerimenti div:last-child { border-bottom: none; }
  .suggerimenti div:hover, .suggerimenti div.attivo { background: var(--blu-tinta); }
  .messaggio { border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; font-size: 15px; }
  .messaggio.errore { background: var(--rosso-tinta); border: 1px solid var(--rosso); color: #7a1f10; }
  .messaggio.attesa { background: var(--blu-tinta); border: 1px solid var(--blu-bordo); color: var(--blu); }
  .successo { text-align: center; padding: 34px 18px; }
  .successo .segno { width: 72px; height: 72px; border-radius: 50%; background: var(--verde-tinta); color: var(--verde); font-size: 40px; line-height: 72px; margin: 0 auto 16px; }
  .successo h1 { font-size: 30px; margin-bottom: 10px; }
  .successo p { color: var(--testo-tenue); margin: 0 0 22px; }
  .nascosto { display: none !important; }
  /* campo trappola per i programmi automatici: le persone non lo vedono */
  .hp { position: absolute; left: -5000px; width: 1px; height: 1px; overflow: hidden; }
  .piede { text-align: center; font-size: 12px; color: var(--testo-tenue); margin-top: 18px; }
</style>
</head>
<body>
<div class="pagina">
  <div class="testata">
    <img src="logo.png" alt="CAF Gianicolense">
    <div>
      <h1>Modulo di iscrizione</h1>
      <div class="sottotitolo">CAF Gianicolense</div>
    </div>
  </div>

  <div id="caricamento" class="messaggio attesa">Caricamento del modulo...</div>

  <form id="modulo" class="nascosto" novalidate autocomplete="on">
    <div class="riquadro">
      <h2>Dati anagrafici</h2>
      <div class="griglia">
        <label class="campo"><span class="etichetta">Cognome <span class="obbl">*</span></span><input type="text" id="f-cognome" maxlength="80" autocomplete="family-name"></label>
        <label class="campo"><span class="etichetta">Nome <span class="obbl">*</span></span><input type="text" id="f-nome" maxlength="80" autocomplete="given-name"></label>
        <label class="campo"><span class="etichetta">Sesso <span class="obbl">*</span></span>
          <select id="f-sesso"><option value="">Scegli...</option><option value="M">Maschio</option><option value="F">Femmina</option></select></label>
        <label class="campo"><span class="etichetta">Data di nascita <span class="obbl">*</span></span><input type="date" id="f-data" min="1900-01-01" autocomplete="bday"></label>
        <label class="campo intero"><span class="etichetta">Comune di nascita o stato estero <span class="obbl">*</span></span>
          <div class="comune"><input type="text" id="f-comune" maxlength="80" autocomplete="off" placeholder="Inizia a scrivere e scegli dall'elenco"><div class="suggerimenti"></div></div>
          <span class="nota">Per chi è nato all'estero: scrivi lo Stato di nascita.</span></label>
        <label class="campo intero"><span class="etichetta">Codice fiscale <span class="obbl">*</span></span>
          <div class="riga-cf"><input type="text" id="f-cf" maxlength="16" autocomplete="off" spellcheck="false"><button type="button" class="btn" id="calcola-cf">Calcola</button></div>
          <span class="nota" id="nota-cf">Si compila da solo con i dati qui sopra. Si può correggere a mano.</span></label>
      </div>
    </div>

    <div class="riquadro" id="riquadro-altri">
      <h2>Altri dati</h2>
      <div class="griglia" id="campi-altri"></div>
    </div>

    <div class="riquadro">
      <h2>Informativa privacy</h2>
      <div class="informativa" id="informativa"></div>
      <label class="spunta"><input type="checkbox" id="f-consenso">
        <span>Dichiaro di aver letto l'informativa sul trattamento dei dati personali e presto il mio consenso ai sensi del Regolamento europeo 679/2016. <span class="obbl">*</span></span></label>
    </div>

    <div class="hp" aria-hidden="true"><label>Sito web <input type="text" id="f-sito" tabindex="-1" autocomplete="off"></label></div>

    <div id="esito"></div>
    <button type="submit" class="btn btn-primario" id="invia">Invia iscrizione</button>
  </form>

  <div id="successo" class="riquadro successo nascosto">
    <div class="segno">&#10003;</div>
    <h1>Iscrizione inviata, grazie</h1>
    <p>I dati sono arrivati al CAF Gianicolense.</p>
  </div>

  <div class="piede">CAF Gianicolense · Designed by Gianluca Cioè</div>
</div>

<script src="comuni.js"></script>
<script src="cf.js"></script>
<script>
'use strict';
const FIREBASE_URL = 'https://caf-gianicolense-default-rtdb.europe-west1.firebasedatabase.app';
const VERSIONE_MODULO = '1';
const $ = s => document.querySelector(s);
let campiModulo = [];

// --- caricamento di campi e informativa, pubblicati dal portale ---
async function carica() {
  $('#caricamento').className = 'messaggio attesa';
  $('#caricamento').textContent = 'Caricamento del modulo...';
  try {
    const r = await fetch(FIREBASE_URL + '/modulo.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('Errore ' + r.status);
    const m = (await r.json()) || {};
    // Firebase restituisce gli elenchi come array, ma per sicurezza si accetta anche un oggetto con chiavi 0, 1, 2...
    campiModulo = (Array.isArray(m.campi) ? m.campi : Object.values(m.campi || {})).filter(c => c && c.nome);
    disegnaCampi();
    const inf = $('#informativa');
    inf.innerHTML = '';
    String(m.privacy || '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).forEach(t => { const p = document.createElement('p'); p.textContent = t; inf.appendChild(p); });
    if (!inf.children.length) inf.textContent = 'Informativa disponibile presso lo sportello.';
    $('#caricamento').classList.add('nascosto');
    $('#modulo').classList.remove('nascosto');
  } catch (e) {
    $('#caricamento').className = 'messaggio errore';
    $('#caricamento').innerHTML = 'Il modulo non si è caricato. Controlla la connessione. <button type="button" class="btn" id="riprova" style="margin-left:8px">Riprova</button>';
    $('#riprova').onclick = carica;
  }
}

const chiave = c => ((c.nome || '') + ' ' + (c.etichetta || '')).toLowerCase();
function disegnaCampi() {
  const box = $('#campi-altri');
  box.innerHTML = '';
  for (const c of campiModulo) {
    const id = 'c-' + c.nome;
    const k = chiave(c);
    const intero = c.tipo === 'textarea' || /indirizzo|oggetto|osservazion|note/.test(k);
    if (c.tipo === 'checkbox') {
      const l = document.createElement('label'); l.className = 'spunta intero';
      const i = document.createElement('input'); i.type = 'checkbox'; i.id = id;
      const s = document.createElement('span'); s.textContent = c.etichetta;
      l.append(i, s); box.appendChild(l); continue;
    }
    const l = document.createElement('label'); l.className = 'campo' + (intero ? ' intero' : '');
    const e = document.createElement('span'); e.className = 'etichetta'; e.textContent = c.etichetta + ' ';
    if (c.obbligatorio) { const o = document.createElement('span'); o.className = 'obbl'; o.textContent = '*'; e.appendChild(o); }
    l.appendChild(e);
    let inp;
    if (c.tipo === 'select') {
      inp = document.createElement('select');
      inp.appendChild(new Option('Scegli...', ''));
      String(c.opzioni || '').split(',').map(x => x.trim()).filter(Boolean).forEach(o => inp.appendChild(new Option(o, o)));
    } else if (c.tipo === 'textarea') { inp = document.createElement('textarea'); inp.rows = 3; inp.maxLength = 1000; }
    else {
      inp = document.createElement('input');
      inp.type = c.tipo === 'data' ? 'date' : c.tipo === 'numero' ? 'number' : /mail/.test(k) ? 'email' : /telefono|cellulare/.test(k) ? 'tel' : 'text';
      inp.maxLength = 1000;
      if (/mail/.test(k)) { inp.autocomplete = 'email'; inp.placeholder = 'nome@esempio.it'; }
      if (/telefono|cellulare/.test(k)) inp.autocomplete = 'tel';
      if (/^cap\b|\bcap$/.test(k.trim()) || c.nome === 'cap') { inp.inputMode = 'numeric'; inp.maxLength = 5; }
    }
    inp.id = id;
    if (/(comune|luogo) di residenza/.test(k)) {
      const w = document.createElement('div'); w.className = 'comune';
      const s = document.createElement('div'); s.className = 'suggerimenti';
      inp.autocomplete = 'off'; inp.placeholder = "Inizia a scrivere e scegli dall'elenco";
      w.append(inp, s); l.appendChild(w); collegaComuni(inp, s);
    } else l.appendChild(inp);
    if (/provincia di residenza/.test(k)) {
      inp.readOnly = true; inp.tabIndex = -1; inp.placeholder = 'Si compila da sola';
      const n = document.createElement('span'); n.className = 'nota'; n.textContent = 'Si compila scegliendo il comune di residenza dall\'elenco.'; l.appendChild(n);
    }
    box.appendChild(l);
  }
  $('#riquadro-altri').classList.toggle('nascosto', !campiModulo.length);
  // provincia di residenza dal comune scelto, es. "Roma (RM)"
  const comuneRes = campiModulo.find(c => /(comune|luogo) di residenza/.test(chiave(c)));
  const provRes = campiModulo.find(c => /provincia di residenza/.test(chiave(c)));
  if (comuneRes && provRes) {
    const a = document.getElementById('c-' + comuneRes.nome), b = document.getElementById('c-' + provRes.nome);
    const agg = () => { const m = /\(([A-Za-z]{2})\)\s*$/.exec(a.value || ''); b.value = m ? m[1].toUpperCase() : ''; };
    a.addEventListener('input', agg); a.addEventListener('change', agg);
  }
}

// --- elenco dei comuni mentre si scrive ---
function collegaComuni(input, box) {
  let attivo = -1;
  const tutti = typeof COMUNI_CATASTALI !== 'undefined' ? Object.keys(COMUNI_CATASTALI) : [];
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function elenca() {
    box.innerHTML = ''; attivo = -1;
    const t = norm(input.value.trim());
    if (t.length < 2) { box.classList.remove('visibile'); return; }
    const trovati = tutti.filter(n => norm(n).includes(t)).sort((a, b) => norm(a).indexOf(t) - norm(b).indexOf(t) || a.length - b.length).slice(0, 8);
    for (const n of trovati) {
      const d = document.createElement('div'); d.textContent = n;
      d.addEventListener('mousedown', e => { e.preventDefault(); input.value = n; box.classList.remove('visibile'); input.dispatchEvent(new Event('input', { bubbles: true })); input.dispatchEvent(new Event('change', { bubbles: true })); });
      box.appendChild(d);
    }
    box.classList.toggle('visibile', trovati.length > 0);
  }
  input.addEventListener('input', e => { if (e.isTrusted) elenca(); });
  input.addEventListener('blur', () => box.classList.remove('visibile'));
  input.addEventListener('keydown', e => {
    const voci = box.querySelectorAll('div');
    if (!voci.length || !box.classList.contains('visibile')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); attivo = Math.min(attivo + 1, voci.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); attivo = Math.max(attivo - 1, 0); }
    else if (e.key === 'Enter' && attivo >= 0) { e.preventDefault(); voci[attivo].dispatchEvent(new Event('mousedown')); return; }
    else return;
    voci.forEach((v, i) => v.classList.toggle('attivo', i === attivo));
  });
}

// --- codice fiscale: si compila da solo finché non lo si corregge a mano ---
let cfAMano = false;
const fissi = () => ({ cognome: $('#f-cognome').value.trim(), nome: $('#f-nome').value.trim(), sesso: $('#f-sesso').value, dataNascita: $('#f-data').value, comuneNascita: $('#f-comune').value.trim() });
function aggiornaCf() {
  const calcolato = CodiceFiscale.calcola(fissi());
  const campo = $('#f-cf'), nota = $('#nota-cf');
  if (!cfAMano && calcolato) campo.value = calcolato;
  const v = CodiceFiscale.pulisci(campo.value);
  nota.className = 'nota';
  if (!v) nota.textContent = 'Si compila da solo con i dati qui sopra. Si può correggere a mano.';
  else if (!CodiceFiscale.valido(v)) { nota.textContent = 'Il codice fiscale non sembra giusto: controlla le 16 lettere e cifre.'; nota.className = 'nota errore'; }
  else if (calcolato && !CodiceFiscale.corrisponde(v, fissi())) { nota.textContent = 'Dai dati inseriti risulterebbe ' + calcolato + '. Se il tuo codice è diverso va bene lo stesso.'; nota.className = 'nota avviso'; }
  else nota.textContent = calcolato ? 'Calcolato dai dati inseriti.' : 'Codice valido.';
}
collegaComuni($('#f-comune'), document.querySelector('#f-comune + .suggerimenti'));
['#f-cognome', '#f-nome', '#f-data', '#f-comune'].forEach(s => $(s).addEventListener('input', aggiornaCf));
['#f-sesso', '#f-data', '#f-comune'].forEach(s => $(s).addEventListener('change', aggiornaCf));
$('#f-cf').addEventListener('input', () => { cfAMano = true; $('#f-cf').value = $('#f-cf').value.toUpperCase(); aggiornaCf(); });
$('#calcola-cf').onclick = () => {
  const c = CodiceFiscale.calcola(fissi());
  if (!c) { const n = $('#nota-cf'); n.textContent = 'Compila cognome, nome, sesso, data e comune di nascita, scegliendo il comune dall\'elenco, poi premi di nuovo Calcola.'; n.className = 'nota errore'; return; }
  cfAMano = false; $('#f-cf').value = c; aggiornaCf();
};

// --- invio ---
// L'identificativo si sceglie una volta sola: se la rete si interrompe e si riprova, Firebase rifiuta il secondo
// invio con lo stesso codice, e allora vuol dire che il primo era già arrivato.
const nuovoId = () => { const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; const b = new Uint8Array(24); crypto.getRandomValues(b); return Array.from(b, x => c[x % c.length]).join(''); };
let idInvio = nuovoId(), tentativi = 0;
const errore = t => { $('#esito').innerHTML = ''; if (!t) return; const d = document.createElement('div'); d.className = 'messaggio errore'; d.textContent = t; $('#esito').appendChild(d); d.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
function raccogli() {
  const f = fissi();
  const d = { cognome: f.cognome, nome: f.nome, sesso: f.sesso, dataNascita: f.dataNascita, comuneNascita: f.comuneNascita, codiceFiscale: CodiceFiscale.pulisci($('#f-cf').value) };
  const mancanti = [];
  if (!d.cognome) mancanti.push('Cognome'); if (!d.nome) mancanti.push('Nome'); if (!d.sesso) mancanti.push('Sesso');
  if (!d.dataNascita) mancanti.push('Data di nascita'); if (!d.comuneNascita) mancanti.push('Comune di nascita o stato estero'); if (!d.codiceFiscale) mancanti.push('Codice fiscale');
  for (const c of campiModulo) {
    const el = document.getElementById('c-' + c.nome);
    if (!el) continue;
    const v = c.tipo === 'checkbox' ? el.checked : el.value.trim();
    if (c.obbligatorio && c.tipo !== 'checkbox' && !v) mancanti.push(c.etichetta);
    if (v !== '' && v !== false) d[c.nome] = v;
    if (c.tipo === 'checkbox') d[c.nome] = v;
  }
  if (mancanti.length) throw new Error('Mancano: ' + mancanti.join(', ') + '.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.dataNascita) || d.dataNascita < '1900-01-01' || d.dataNascita > new Date().toISOString().slice(0, 10)) throw new Error('La data di nascita non è valida: sceglila dal calendario.');
  if (!CodiceFiscale.valido(d.codiceFiscale)) throw new Error('Il codice fiscale non sembra giusto: controlla le 16 lettere e cifre.');
  for (const c of campiModulo) {
    const v = d[c.nome];
    if (typeof v === 'string' && /mail/.test(chiave(c)) && c.tipo !== 'checkbox' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) throw new Error('L\'indirizzo email non sembra giusto, es. nome@esempio.it');
    if (typeof v === 'string' && c.tipo === 'data' && !/^\d{4}-\d{2}-\d{2}$/.test(v)) throw new Error(`"${c.etichetta}" non è una data valida: sceglila dal calendario.`);
  }
  if (!$('#f-consenso').checked) throw new Error('Per inviare serve il consenso al trattamento dei dati.');
  d.consensoPrivacy = true;
  return d;
}
function fatto() { $('#modulo').classList.add('nascosto'); $('#successo').classList.remove('nascosto'); window.scrollTo(0, 0); }
$('#modulo').addEventListener('submit', async e => {
  e.preventDefault();
  errore('');
  let dati;
  try { dati = raccogli(); } catch (x) { errore(x.message); return; }
  if ($('#f-sito').value) { fatto(); return; } // compilato da un programma automatico: non si manda niente
  const b = $('#invia');
  b.disabled = true; b.textContent = 'Invio in corso...';
  tentativi++;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(`${FIREBASE_URL}/inArrivo/${idInvio}.json`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
      body: JSON.stringify({ ricevuto: { '.sv': 'timestamp' }, versioneModulo: VERSIONE_MODULO, dati })
    });
    if (r.ok || (tentativi > 1 && (r.status === 401 || r.status === 403))) { fatto(); return; }
    errore('L\'invio non è riuscito (errore ' + r.status + '). Riprova; se non funziona, avvisa lo sportello.');
  } catch (x) {
    errore('Connessione assente o troppo lenta. Controlla la rete e premi di nuovo Invia: l\'iscrizione non verrà registrata due volte.');
  } finally { clearTimeout(t); b.disabled = false; b.textContent = 'Invia iscrizione'; }
});

aggiornaCf();
carica();
</script>
