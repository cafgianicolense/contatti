<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iscrizione CAF Gianicolense</title>
<!-- rev. 1 -->
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
  .box { max-width: 500px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
  h1 { font-size: 20px; margin-top: 0; }
  label { display: block; margin-top: 14px; font-weight: bold; font-size: 14px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
    border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
  }
  .checkbox-row { display: flex; align-items: center; margin-top: 14px; }
  .checkbox-row input { margin-right: 8px; }
  .checkbox-row label { margin-top: 0; }
  button { margin-top: 20px; width: 100%; padding: 12px; background: #2a6f2a; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
  button:disabled { background: #999; }
  #esito { margin-top: 16px; font-size: 14px; }
  .ok { color: #2a6f2a; }
  .errore { color: #b02a2a; }
</style>
</head>
<body>
<div class="box">
  <img src="logo.png" alt="CAF Gianicolense" style="max-width:280px;display:block;margin:0 auto 16px">
  <h1 style="text-align:center">Modulo di iscrizione</h1>
  <form id="form"></form>
  <div id="esito"></div>
</div>

<script>
  // Sostituisci con l'URL del tuo Web App Apps Script, quello che finisce con /exec
  const BACKEND_URL = 'INCOLLA_QUI_URL_APPS_SCRIPT';

  const formEl = document.getElementById('form');
  const esitoEl = document.getElementById('esito');
  let campiCorrenti = [];

  function creaCampo(campo) {
    const wrapper = document.createElement('div');
    if (campo.tipo === 'checkbox') {
      wrapper.className = 'checkbox-row';
      wrapper.innerHTML = `
        <input type="checkbox" id="c_${campo.nome}" name="${campo.nome}">
        <label for="c_${campo.nome}">${campo.etichetta}</label>
      `;
      return wrapper;
    }
    const label = document.createElement('label');
    label.textContent = campo.etichetta + (campo.obbligatorio ? ' *' : '');
    label.htmlFor = 'c_' + campo.nome;
    wrapper.appendChild(label);

    let input;
    if (campo.tipo === 'select') {
      input = document.createElement('select');
      const opzioni = (campo.opzioni || '').split(',').map(o => o.trim()).filter(Boolean);
      const vuota = document.createElement('option');
      vuota.value = '';
      vuota.textContent = 'Seleziona...';
      input.appendChild(vuota);
      opzioni.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o;
        opt.textContent = o;
        input.appendChild(opt);
      });
    } else if (campo.tipo === 'textarea') {
      input = document.createElement('textarea');
      input.rows = 3;
    } else {
      input = document.createElement('input');
      input.type = campo.tipo === 'numero' ? 'number' : 'text';
    }
    input.id = 'c_' + campo.nome;
    input.name = campo.nome;
    if (campo.obbligatorio) input.required = true;
    wrapper.appendChild(input);
    return wrapper;
  }

  async function caricaForm() {
    try {
      const res = await fetch(BACKEND_URL + '?action=getForm');
      const data = await res.json();
      campiCorrenti = data.campi || [];
      formEl.innerHTML = '';
      campiCorrenti.forEach(c => formEl.appendChild(creaCampo(c)));
      const btn = document.createElement('button');
      btn.type = 'submit';
      btn.textContent = 'Invia iscrizione';
      formEl.appendChild(btn);
    } catch (err) {
      esitoEl.innerHTML = '<span class="errore">Errore nel caricamento del modulo. Riprova più tardi.</span>';
    }
  }

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = formEl.querySelector('button');
    btn.disabled = true;
    esitoEl.textContent = '';

    const dati = {};
    campiCorrenti.forEach(c => {
      const el = document.getElementById('c_' + c.nome);
      dati[c.etichetta] = c.tipo === 'checkbox' ? (el.checked ? 'Si' : 'No') : el.value;
    });

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'submit', dati })
      });
      const result = await res.json();
      if (result.ok) {
        esitoEl.innerHTML = '<span class="ok">Iscrizione inviata con successo.</span>';
        formEl.reset();
      } else {
        esitoEl.innerHTML = '<span class="errore">Si è verificato un errore, riprova.</span>';
      }
    } catch (err) {
      esitoEl.innerHTML = '<span class="errore">Errore di connessione, riprova.</span>';
    } finally {
      btn.disabled = false;
    }
  });

  caricaForm();
</script>
</body>
</html>
